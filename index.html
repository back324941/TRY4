<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>搭伙晚餐 Hearth Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #1a1410; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent; 
            font-size: 20px; /* 整體字體加大 */
        }
        .gold-gradient { background: linear-gradient(135deg, #d4a574 0%, #a67c52 100%); }
        .day-tab.active { border-color: #a67c52; background-color: rgba(166, 124, 82, 0.1); color: #a67c52; }
        #cart-drawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        #cart-drawer.open { transform: translateX(0); }
        #cart-overlay { transition: opacity 0.4s ease; pointer-events: none; opacity: 0; }
        #cart-overlay.open { pointer-events: auto; opacity: 1; }
        .active-scale:active { transform: scale(0.9); transition: 0.1s; }
        
        /* 超大垂直按鈕設計 */
        .v-qty-btn { 
            width: 70px; 
            height: 65px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 32px; 
            font-weight: 900; 
        }
        .v-qty-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #f8f9fa; 
            border: 5px solid #eeeeee; 
            border-radius: 1.8rem; 
            overflow: hidden; 
            width: 80px; 
        }
        .qty-num {
            font-size: 28px;
            font-weight: 900;
            padding: 5px 0;
            color: #333;
        }
        input, select { font-size: 22px !important; font-weight: 900 !important; }
    </style>
</head>
<body class="min-h-screen py-4 px-3 pb-24 text-gray-900">

    <div class="fixed top-24 right-0 z-40">
        <button type="button" onclick="toggleCart(true)" class="w-16 py-8 gold-gradient border-y border-l border-white/30 flex flex-col items-center gap-2 active-scale rounded-l-[2.5rem] shadow-2xl">
            <div class="bg-white/20 w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-inner">🛒</div>
            <div class="flex flex-col items-center">
                <span class="text-[14px] text-white/90 font-black" style="writing-mode: vertical-lr;">總額</span>
                <span class="text-2xl font-black text-yellow-300 mt-1 italic" id="cart-total">0</span>
            </div>
        </button>
    </div>

    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50"></div>
    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-[90%] max-w-[400px] bg-white z-50 shadow-2xl flex flex-col text-gray-800">
        <div class="flex justify-between items-center p-6 border-b-8 border-gray-100">
            <h2 class="text-3xl font-black italic">確實預訂清單</h2>
            <button onclick="toggleCart(false)" class="text-gray-300 text-4xl p-2">✕</button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-5 bg-white"></div>
        <div class="p-8 bg-gray-50 border-t-4 border-gray-200 space-y-4">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xl text-gray-500 font-bold">目前總計</span>
                <span class="text-5xl font-black text-[#a67c52]">NT$ <span id="drawer-total">0</span></span>
            </div>
            <button onclick="toggleCart(false)" class="w-full py-5 bg-white border-4 border-gray-200 rounded-3xl font-black text-gray-500 text-xl active-scale">返回繼續挑選</button>
            <button onclick="clearAllSelections()" class="w-full py-4 bg-red-50 text-red-400 rounded-2xl font-bold text-lg active-scale">⚠️ 全部清空重選</button>
        </div>
    </div>

    <div class="max-w-xl mx-auto">
        <div id="form-container" class="bg-white rounded-[3rem] shadow-2xl overflow-hidden">
            <div class="gold-gradient p-12 text-white text-center">
                <h1 class="text-5xl font-black tracking-widest">搭伙晚餐</h1>
                <p class="text-sm mt-3 tracking-[0.4em] font-light italic opacity-90 uppercase">Hearth Table</p>
                <div class="mt-8 inline-block bg-white/20 px-8 py-4 rounded-full border-2 border-white/30 backdrop-blur-md">
                    <p class="text-lg font-black text-yellow-200">✨ 嚴選初榨橄欖油．無味精 ✨</p>
                </div>
            </div>

            <form id="orderForm" class="p-6 sm:p-12 space-y-12">
                <div class="space-y-8">
                    <input type="text" id="userName" required class="w-full px-8 py-6 rounded-[2rem] border-4 border-gray-100 text-2xl font-black outline-none focus:border-[#a67c52] bg-gray-50" placeholder="Line 名稱 / 訂購人">
                    <div class="grid grid-cols-1 gap-5">
                        <div class="flex gap-4">
                            <select id="deliveryType" class="flex-1 px-4 py-6 rounded-[2rem] border-4 border-gray-100 bg-gray-50 font-black text-xl text-center appearance-none" onchange="toggleAddress(this.value)">
                                <option value="自取">店內自取</option>
                                <option value="外送">外送 (3km內)</option>
                                <option value="外送-管理員代收">外送 (管理員)</option>
                            </select>
                            <select id="pickupTime" class="flex-1 px-4 py-6 rounded-[2rem] border-4 border-gray-100 bg-gray-50 font-black text-xl text-center appearance-none">
                                <option value="17:00-18:00">17:00</option>
                                <option value="17:30-18:30">17:30</option>
                                <option value="18:30-19:00">18:30</option>
                            </select>
                        </div>
                    </div>
                    <div id="addressBox" class="hidden">
                        <input type="text" id="userAddress" class="w-full px-8 py-6 rounded-[2rem] border-4 border-orange-200 text-xl font-black" placeholder="請輸入完整外送地址">
                        <p class="text-lg text-orange-600 font-black mt-3 ml-4 italic">※ 外送加收 $50 運費/日</p>
                    </div>
                    <select id="paymentMethod" class="w-full px-8 py-6 rounded-[2rem] border-4 border-gray-100 bg-gray-50 font-black text-xl text-center appearance-none">
                        <option value="轉帳">💰 轉帳 (優先)</option>
                        <option value="管理員代付">👤 管理員代付 (現金)</option>
                        <option value="現金">💵 現場支付 (自取)</option>
                    </select>
                </div>

                <div class="space-y-6">
                    <div class="flex justify-between items-end px-4">
                        <h2 class="text-xl font-black text-gray-400 italic">STEP 2. 選擇日期</h2>
                        <button type="button" onclick="clearCurrentDay()" class="text-lg font-black text-red-400 border-b-2 border-red-200 active-scale">清空今日</button>
                    </div>
                    <div class="flex border-[6px] rounded-[2.5rem] overflow-hidden bg-gray-100 border-gray-100 shadow-inner">
                        <button type="button" onclick="switchDay('Tue')" id="tab-Tue" class="day-tab active flex-1 py-6 text-center font-black text-3xl transition-all">二</button>
                        <button type="button" onclick="switchDay('Wed')" id="tab-Wed" class="day-tab flex-1 py-6 text-center font-black text-3xl transition-all">三</button>
                        <button type="button" onclick="switchDay('Thu')" id="tab-Thu" class="day-tab flex-1 py-6 text-center font-black text-3xl transition-all">四</button>
                        <button type="button" onclick="switchDay('Fri')" id="tab-Fri" class="day-tab flex-1 py-6 text-center font-black text-3xl transition-all">五</button>
                    </div>
                </div>

                <div id="menu-content" class="space-y-12 min-h-[500px]"></div>

                <div class="pt-12 flex flex-col gap-6">
                    <button type="button" id="nextDayBtn" onclick="goToNextDay()" class="w-full py-7 bg-gray-800 text-white rounded-[2.5rem] font-black text-2xl shadow-xl active-scale">下一天選單 <span>➜</span></button>
                    <button type="submit" id="submitBtn" class="gold-gradient w-full py-8 rounded-[3rem] text-white font-black text-4xl shadow-2xl active-scale">確認預訂 ➔</button>
                </div>
            </form>
        </div>

        <div id="success-container" class="hidden bg-white rounded-[3rem] shadow-2xl p-6 sm:p-12 text-center border-[6px] border-orange-100">
            <div class="w-24 h-24 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto mb-10 text-5xl shadow-xl">✓</div>
            <div class="bg-red-50 p-10 rounded-[3rem] border-4 border-red-100 mb-10 text-center">
                <h2 class="text-4xl font-black text-red-600 mb-4">📸 請截圖明細回傳</h2>
                <p class="text-red-500 font-black text-2xl leading-relaxed">請將下方文字完整截圖<br>私訊回傳至 Line 進行預訂</p>
            </div>
            <div id="summary-content" class="text-left text-xl font-black whitespace-pre-line leading-relaxed border-4 p-10 rounded-[3rem] bg-gray-50 font-mono text-gray-800 shadow-inner"></div>
            <button onclick="location.reload()" class="mt-16 text-gray-400 text-lg font-black underline uppercase active-scale">重新填寫單據</button>
        </div>
    </div>

    <script>
        const menus = {
            Tue: { main: [{i:"A",n:"果香翅小腿",m:180,s:100},{i:"B",n:"薑煸小卷",m:250,s:150},{i:"C",n:"蔥爆豬肉片",m:180,s:100},{i:"D",n:"乾煎鱸魚",m:210,s:120},{i:"E",n:"乾煎鮭魚",m:290,s:170}], side: [{i:"F",n:"糯米椒炒豆乾",m:100,s:60},{i:"G",n:"馬鈴薯炒肉絲",m:110,s:70},{i:"H",n:"番茄炒蛋",m:100,s:60}], soup: {n:"味噌牡蠣湯", p:100} },
            Wed: { main: [{i:"A",n:"香菇肉燥",m:180,s:100},{i:"B",n:"檸檬魚",m:230,s:130},{i:"C",n:"蔥爆牛肉",m:240,s:140},{i:"D",n:"大黃瓜燴蝦仁",m:180,s:100},{i:"E",n:"乾煎鮭魚",m:290,s:170}], side: [{i:"F",n:"蔬菜烘蛋",m:120,s:60},{i:"G",n:"馬鈴薯炒肉絲",m:110,s:70},{i:"H",n:"蔥爆豆乾",m:100,s:60}], soup: {n:"海帶芽貢丸湯", p:100} },
            Thu: { main: [{i:"A",n:"南瓜滷肉",m:220,s:130},{i:"B",n:"茄汁鯖魚",m:200,s:120},{i:"C",n:"蔥爆牛肉",m:240,s:140},{i:"D",n:"大黃瓜燴蝦仁",m:180,s:100},{i:"E",n:"乾煎鮭魚",m:290,s:170}], side: [{i:"F",n:"蟹黃豆腐煲",m:120,s:70},{i:"G",n:"蔥爆豆乾",m:100,s:60},{i:"H",n:"番茄炒蛋",m:100,s:60}], soup: {n:"香菇雞湯", p:120} },
            Fri: { main: [{i:"A",n:"白醬嫩雞",m:200,s:120},{i:"B",n:"絲瓜鮮蚵",m:190,s:110},{i:"C",n:"蔥爆豬肉片",m:180,s:100},{i:"D",n:"紅燒鱸魚",m:210,s:120},{i:"E",n:"乾煎鮭魚",m:290,s:170}], side: [{i:"F",n:"金針菇炒豆包",m:100,s:60},{i:"G",n:"蔥爆豆乾",m:100,s:60},{i:"H",n:"番茄炒蛋",m:100,s:60}], soup: {n:"香根牛肉湯", p:120} }
        };

        let selections = { Tue: {}, Wed: {}, Thu: {}, Fri: {} };
        let currentDay = 'Tue';
        const dayOrder = ['Tue', 'Wed', 'Thu', 'Fri'];

        function toggleCart(open) {
            document.getElementById('cart-drawer').classList.toggle('open', open);
            document.getElementById('cart-overlay').classList.toggle('open', open);
            if(open) updateDrawerList();
        }
        function toggleAddress(val) { document.getElementById('addressBox').classList.toggle('hidden', val==='自取'); updateTotal(); }
        function clearCurrentDay() { if(confirm("確定清空今日預訂？")) { selections[currentDay] = {}; renderMenu(); updateTotal(); } }
        function clearAllSelections() { if(confirm("確定全部清空？")) { selections = { Tue: {}, Wed: {}, Thu: {}, Fri: {} }; toggleCart(false); renderMenu(); updateTotal(); } }
        function switchDay(day) { 
            currentDay = day; 
            document.querySelectorAll('.day-tab').forEach(t=>t.classList.remove('active')); 
            document.getElementById(`tab-${day}`).classList.add('active'); 
            renderMenu();
            document.getElementById('nextDayBtn').classList.toggle('hidden', day === 'Fri');
        }
        function goToNextDay() {
            const idx = dayOrder.indexOf(currentDay);
            if(idx < 3) switchDay(dayOrder[idx+1]);
            window.scrollTo({top: 300, behavior: 'smooth'});
        }

        function renderMenu() {
            const sel = selections[currentDay];
            const data = menus[currentDay];
            
            let html = `<div class="grid grid-cols-1 gap-6">
                <label class="cursor-pointer"><input type="radio" name="orderType" value="M" ${sel.type==='M'?'checked':''} onchange="updateSel('type','M')" class="peer sr-only">
                    <div class="p-8 border-[6px] rounded-[2.5rem] font-black text-gray-300 peer-checked:border-[#a67c52] peer-checked:bg-orange-50 peer-checked:text-[#a67c52] shadow-sm transition-all relative">
                        <div class="text-4xl">M 套餐 <span class="text-[#a67c52] ml-2 font-black">$500</span></div>
                        <div class="text-lg font-bold opacity-70 mt-2">1 主菜(M) + 1 副菜(M) + 2 時蔬</div>
                    </div>
                </label>
                <label class="cursor-pointer"><input type="radio" name="orderType" value="S" ${sel.type==='S'?'checked':''} onchange="updateSel('type','S')" class="peer sr-only">
                    <div class="p-8 border-[6px] rounded-[2.5rem] font-black text-gray-300 peer-checked:border-[#a67c52] peer-checked:bg-orange-50 peer-checked:text-[#a67c52] shadow-sm transition-all">
                        <div class="text-4xl">S 套餐 <span class="text-[#a67c52] ml-2 font-black">$300</span></div>
                        <div class="text-lg font-bold opacity-70 mt-2">1 主菜(S) + 1 副菜(S) + 2 時蔬</div>
                    </div>
                </label>
                <button type="button" onclick="updateSel('type','NONE')" class="py-6 border-4 border-dashed rounded-[2rem] font-black ${sel.type==='NONE'?'border-[#a67c52] text-[#a67c52] bg-orange-50':'text-gray-300 border-gray-200'} text-xl italic transition-all">
                    ➔ 切換至自由單點模式
                </button>
            </div>`;

            if (sel.type === 'M' || sel.type === 'S') {
                const limit = (sel.type === 'M') ? 180 : 100;
                html += `<div class="space-y-5 pt-8"><h3 class="text-lg font-black text-gray-400 border-l-[10px] border-gray-200 pl-4 italic">選擇套餐主菜</h3>`;
                data.main.forEach((m, i) => {
                    const price = (sel.type === 'M') ? m.m : m.s;
                    const extra = Math.max(0, price - limit);
                    html += `<label class="block cursor-pointer"><input type="radio" name="mainC" ${sel.mainIdx===i?'checked':''} onchange="updateSel('mainIdx',${i})" class="peer sr-only"><div class="p-8 border-4 rounded-[2.5rem] font-black text-gray-800 peer-checked:border-[#a67c52] peer-checked:bg-orange-50/50 flex justify-between items-center text-3xl shadow-sm transition-all"><span>${m.i}. ${m.n}</span>${extra>0?`<span class="text-xl text-orange-600 bg-orange-100 px-4 py-2 rounded-full">+$${extra}</span>`:`<span class="text-lg text-gray-300">$0</span>`}</div></label>`;
                });
                html += `</div><div class="space-y-5 pt-8"><h3 class="text-lg font-black text-gray-400 border-l-[10px] border-gray-200 pl-4 italic">選擇套餐副菜</h3>`;
                data.side.forEach((s, i) => {
                    html += `<label class="block cursor-pointer"><input type="radio" name="sideC" ${sel.sideIdx===i?'checked':''} onchange="updateSel('sideIdx',${i})" class="peer sr-only"><div class="p-8 border-4 rounded-[2.5rem] font-black text-gray-800 peer-checked:border-[#a67c52] peer-checked:bg-orange-50/50 text-3xl shadow-sm transition-all">${s.i}. ${s.n}</div></label>`;
                });
                html += `<label class="block cursor-pointer"><input type="radio" name="sideC" ${sel.sideIdx==='extra-veg'?'checked':''} onchange="updateSel('sideIdx','extra-veg')" class="peer sr-only"><div class="p-8 border-4 rounded-[2.5rem] font-black text-green-700 peer-checked:border-green-500 bg-green-50 text-3xl shadow-sm italic text-center">✨ 不要副菜，時蔬量加大</div></label></div>`;
            }

            if(sel.type) {
                html += `<div class="pt-12 border-t-[6px] border-gray-100 space-y-8"><h3 class="text-2xl font-black text-[#a67c52] italic border-l-[12px] border-[#a67c52] pl-4 uppercase tracking-widest">加點項目</h3>`;
                data.main.forEach((m, i) => html += renderAddon(`addonM-${i}`, m.i, m.n, m.m, m.s));
                data.side.forEach((s, i) => html += renderAddon(`addonS-${i}`, s.i, s.n, s.m, s.s));
                
                const sQty = sel['addonSoup'] || 0;
                html += `<div class="p-8 bg-gray-100 rounded-[3rem] flex justify-between items-center border-4 border-gray-200 shadow-lg">
                    <div><div class="font-black text-3xl text-gray-800">${data.soup.n}</div><div class="text-2xl text-orange-600 font-black mt-2">$${data.soup.p}</div></div>
                    <div class="v-qty-container">
                        <button type="button" onclick="changeQty('addonSoup',1)" class="v-qty-btn bg-[#a67c52] text-white active-scale">＋</button>
                        <span class="qty-num">${sQty}</span>
                        <button type="button" onclick="changeQty('addonSoup',-1)" class="v-qty-btn bg-gray-300 text-gray-600 active-scale">－</button>
                    </div>
                </div></div>`;
            }
            document.getElementById('menu-content').innerHTML = html;
        }

        function renderAddon(id, letter, name, pM, pS) {
            const sel = selections[currentDay];
            return `<div class="p-8 bg-white rounded-[3rem] space-y-6 border-4 border-gray-100 shadow-xl">
                <div class="font-black text-gray-800 text-3xl pl-2">${letter}. ${name}</div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-gray-50 p-5 rounded-[2rem] flex justify-between items-center border-2 border-gray-100">
                        <div class="flex flex-col"><span class="text-lg font-black text-gray-400">M大</span><span class="text-2xl font-black text-orange-600">$${pM}</span></div>
                        <div class="v-qty-container">
                            <button type="button" onclick="changeQty('${id}-M',1)" class="v-qty-btn bg-[#a67c52] text-white active-scale">＋</button>
                            <span class="qty-num">${sel[id+'-M']||0}</span>
                            <button type="button" onclick="changeQty('${id}-M',-1)" class="v-qty-btn bg-gray-300 text-gray-600 active-scale">－</button>
                        </div>
                    </div>
                    <div class="bg-gray-50 p-5 rounded-[2rem] flex justify-between items-center border-2 border-gray-100">
                        <div class="flex flex-col"><span class="text-lg font-black text-gray-400">S小</span><span class="text-2xl font-black text-orange-600">$${pS}</span></div>
                        <div class="v-qty-container">
                            <button type="button" onclick="changeQty('${id}-S',1)" class="v-qty-btn bg-[#a67c52] text-white active-scale">＋</button>
                            <span class="qty-num">${sel[id+'-S']||0}</span>
                            <button type="button" onclick="changeQty('${id}-S',-1)" class="v-qty-btn bg-gray-300 text-gray-600 active-scale">－</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function updateSel(k, v) { selections[currentDay][k] = v; renderMenu(); updateTotal(); }
        function changeQty(id, amt) { selections[currentDay][id] = Math.max(0, (selections[currentDay][id] || 0) + amt); renderMenu(); updateTotal(); }

        function updateTotal() {
            let total = 0; let activeDays = 0;
            const delivery = document.getElementById('deliveryType').value;
            for (let day in selections) {
                const s = selections[day]; if (!s.type) continue;
                activeDays++;
                if (s.type === 'M') total += 500 + Math.max(0, (menus[day].main[s.mainIdx||0]?.m || 0) - 180);
                else if (s.type === 'S') total += 300 + Math.max(0, (menus[day].main[s.mainIdx||0]?.s || 0) - 100);
                Object.keys(s).forEach(k => { if (s[k]>0 && k.includes('addon')) {
                    const p = k.split('-');
                    if (k.startsWith('addonM-')) total += s[k] * (p[2]==='M' ? menus[day].main[p[1]].m : menus[day].main[p[1]].s);
                    if (k.startsWith('addonS-')) total += s[k] * (p[2]==='M' ? menus[day].side[p[1]].m : menus[day].side[p[1]].s);
                    if (k === 'addonSoup') total += s[k] * menus[day].soup.p;
                }});
            }
            if (delivery !== '自取') total += activeDays * 50;
            document.getElementById('cart-total').innerText = total.toLocaleString();
            document.getElementById('drawer-total').innerText = total.toLocaleString();
        }

        function updateDrawerList() {
            let list = [];
            for (let day in selections) {
                const s = selections[day]; if (!s.type) continue;
                const dName = {Tue:'週二',Wed:'週三',Thu:'週四',Fri:'週五'}[day];
                let details = [];
                if (s.type !== 'NONE') {
                    details.push(`● ${s.type}套餐：${menus[day].main[s.mainIdx||0].n}`);
                    details.push(`● 副菜：${s.sideIdx==='extra-veg'?'時蔬加量':menus[day].side[s.sideIdx||0].n}`);
                }
                Object.keys(s).forEach(k => { if (s[k]>0 && k.includes('addon')) {
                    const p = k.split('-');
                    if (k.startsWith('addonM-')) details.push(`＋ 加點(${p[2]}) ${menus[day].main[p[1]].n} x${s[k]}`);
                    if (k.startsWith('addonS-')) details.push(`＋ 加點(${p[2]}) ${menus[day].side[p[1]].n} x${s[k]}`);
                    if (k === 'addonSoup') details.push(`＋ 加點湯品 ${menus[day].soup.n} x${s[k]}`);
                }});
                list.push(`<div class="p-6 bg-orange-50/50 rounded-[2rem] border-l-[12px] border-[#a67c52] shadow-sm"><div class="text-[#a67c52] font-black text-2xl mb-2">${dName}</div><div class="text-lg font-bold text-gray-600 leading-relaxed">${details.join('<br>')}</div></div>`);
            }
            document.getElementById('cart-items-list').innerHTML = list.length ? list.join('') : '<div class="text-center py-24 text-gray-300 font-black text-2xl italic">目前尚無預訂</div>';
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const delivery = document.getElementById('deliveryType').value;
            const address = document.getElementById('userAddress').value;
            const payment = document.getElementById('paymentMethod').value;
            let d = [
                `【搭伙晚餐 Hearth Table 預訂單】`,
                `▫️ 訂購人：${document.getElementById('userName').value}`,
                `▫️ 配送：${delivery}${address ? ' ('+address+')' : ''}`,
                `▫️ 時間：${document.getElementById('pickupTime').value}`,
                `▫️ 付款：${payment}`,
                `---------------------------`,
                `🚫 提醒：餐點均「不附白飯」`,
                `---------------------------`
            ];
            for (let day in selections) {
                const s = selections[day]; if (!s.type) continue;
                d.push(`● ${{Tue:'週二',Wed:'週三',Thu:'週四',Fri:'週五'}[day]} 清單：`);
                if (s.type !== 'NONE') {
                    d.push(` ▫️ 套餐主菜：${menus[day].main[s.mainIdx||0].n}`);
                    d.push(` ▫️ 套餐副菜：${s.sideIdx==='extra-veg'?'時蔬加量':menus[day].side[s.sideIdx||0].n}`);
                }
                Object.keys(s).forEach(k => { if (s[k]>0 && k.includes('addon')) {
                    const p = k.split('-');
                    if (k.startsWith('addonM-')) d.push(` ▫️ [加點] ${menus[day].main[p[1]].n}(${p[2]}) x${s[k]}`);
                    if (k.startsWith('addonS-')) d.push(` ▫️ [加點] ${menus[day].side[p[1]].n}(${p[2]}) x${s[k]}`);
                    if (k === 'addonSoup') d.push(` ▫️ [加點] ${menus[day].soup.n} x${s[k]}`);
                }});
                d.push("");
            }
            d.push(`---------------------------`,`【應付總金額：NT$ ${document.getElementById('cart-total').innerText}】`);
            if (payment === '管理員代付') d.push(`⚠️ 請將現金裝袋交給管理員。`);
            
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('success-container').classList.remove('hidden');
            document.getElementById('summary-content').innerText = d.join('\n');
            window.scrollTo(0, 0);
        });

        switchDay('Tue');
    </script>
</body>
</html>
